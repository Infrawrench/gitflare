syntax = "proto3";

package forge.v1;

import "forge/v1/common.proto";
import "google/protobuf/timestamp.proto";

enum WebhookEvent {
  WEBHOOK_EVENT_UNSPECIFIED = 0;
  WEBHOOK_EVENT_PUSH = 1;
  WEBHOOK_EVENT_ISSUES = 2;
  WEBHOOK_EVENT_ISSUE_COMMENT = 3;
  WEBHOOK_EVENT_PULL_REQUEST = 4;
  WEBHOOK_EVENT_PULL_REQUEST_REVIEW = 5;
  WEBHOOK_EVENT_RELEASE = 6;
  WEBHOOK_EVENT_CI_RUN = 7;
  WEBHOOK_EVENT_REPO = 8;
  WEBHOOK_EVENT_STAR = 9;
  WEBHOOK_EVENT_FORK = 10;
  WEBHOOK_EVENT_WIKI = 11;
}

message Webhook {
  string id = 1;
  string url = 2;
  string content_type = 3;
  repeated WebhookEvent events = 4;
  bool active = 5;
  // True when a signing secret is configured. The secret itself is never read back.
  bool has_secret = 6;
  google.protobuf.Timestamp created_at = 7;
  optional google.protobuf.Timestamp last_delivery_at = 8;
  optional int32 last_status_code = 9;
}

message Delivery {
  string id = 1;
  WebhookEvent event = 2;
  int32 status_code = 3;
  // Set when the request never completed (DNS failure, timeout, TLS error).
  string error = 4;
  int32 duration_ms = 5;
  int32 attempt = 6;
  string request_body = 7;
  string response_body = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ListWebhooksRequest {
  string owner = 1;
  // Empty targets org-level hooks that fire for every repo in the org.
  string repo = 2;
}
message ListWebhooksResponse { repeated Webhook webhooks = 1; }

message CreateWebhookRequest {
  string owner = 1;
  string repo = 2;
  string url = 3;
  string content_type = 4;
  // Signs each delivery with HMAC-SHA256 in the X-Gitflare-Signature-256 header.
  string secret = 5;
  repeated WebhookEvent events = 6;
  bool active = 7;
}
message CreateWebhookResponse { Webhook webhook = 1; }

message UpdateWebhookRequest {
  string webhook_id = 1;
  optional string url = 2;
  optional string content_type = 3;
  // Empty string clears the secret; absent leaves it unchanged.
  optional string secret = 4;
  repeated WebhookEvent events = 5;
  bool set_events = 6;
  optional bool active = 7;
}
message UpdateWebhookResponse { Webhook webhook = 1; }

message DeleteWebhookRequest { string webhook_id = 1; }
message DeleteWebhookResponse {}

message ListDeliveriesRequest {
  string webhook_id = 1;
  PageRequest page = 2;
}
message ListDeliveriesResponse {
  repeated Delivery deliveries = 1;
  PageResponse page = 2;
}

message RedeliverRequest { string delivery_id = 1; }
message RedeliverResponse { Delivery delivery = 1; }

message PingWebhookRequest { string webhook_id = 1; }
message PingWebhookResponse { Delivery delivery = 1; }

service WebhookService {
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);
  rpc CreateWebhook(CreateWebhookRequest) returns (CreateWebhookResponse);
  rpc UpdateWebhook(UpdateWebhookRequest) returns (UpdateWebhookResponse);
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse);
  rpc ListDeliveries(ListDeliveriesRequest) returns (ListDeliveriesResponse);
  rpc Redeliver(RedeliverRequest) returns (RedeliverResponse);
  rpc PingWebhook(PingWebhookRequest) returns (PingWebhookResponse);
}
